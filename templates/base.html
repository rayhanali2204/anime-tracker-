<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ANIME TRACKER</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">


    <style>
        :root{
            --text-primary: #e5e7ec;
            --page-bg: #000000;
            --accent: #1c0cf7;
            --surface:  rgb(16, 43, 220);

        }

        body{
            font-family: 'Oswald', sans-serif;
            background: var(--page-bg);
            color: var(--text-primary);
            
            min-height: 100vh;
        }

        .page-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-top: 5rem;
        
        }

        .nav-bar{
            width: 100%;
            background-color: var(--surface);
            color: rgb(0, 0, 0);

            display: flex;
            justify-content: space-between;
            align-items: centre;

            padding: 1rem 2rem;

            border-bottom: 2px solid black;

            margin-bottom: 2rem;
        }

        .anime-container {
            display: flex;
            gap: 1rem;

            overflow-x: auto;
        }
        
        

        .form-control-custom {
            width: 100%;
            padding: 0.6rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            color: var(--page-bg);
            background: var(--text-primary);
            transition: border-color 0.15s;
        }

        .form-control-custom:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
        }

        .form-label-custom {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
            display: block;
        }

        .btn-primary-custom {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 1.1rem;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.15s;
        }

         .btn-primary-custom:hover { opacity: 0.9; color: rgb(15, 2, 2); }

        .carousel-wrapper {
        position: relative;
        width: 100%;
        max-width: 1000px;
        margin: 2rem auto;
        }

        .featured-anime{
            border: 2px solid rgb(0, 0, 0);

            white-space: nowrap;

            display: flex;
            gap: 1rem;;

            overflow-x: auto;
            
            scroll-behavior: smooth;

            white-space: nowrap;

            padding: 10px;

            

            mask-image: linear-gradient(
            to right,
            transparent,
            black 10%,
            black 90%,
            transparent
            );

            
        }

        .featured-anime img {
        width: 180px;
        border-radius: 10px;
        object-fit: cover;

        flex-shrink: 0;
        border-radius: 10px;
        }

        .scroll-btn{

            background: red;
            width: 50px;
            height: 50px;


            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            
            border: 1px solid #ddd;
            cursor: pointer;
            z-index: 10;

            padding: 0.5rem 0.8rem;
            border-radius: 50%;
        }

        .scroll-btn.left {
            left: 10px;
        }

        .scroll-btn.right {
            right: 10px;
        }

        .anime-list {
            width: min(1200px, 95%);
            margin-top: 0;
        }

        .anime-list-header,
        .anime-row {
            display: grid;
            grid-template-columns: minmax(250px, 1.4fr) 1fr 1.5fr 100px;
            gap: 1.5rem;
            align-items: center;
            background-color: var(--accent);
        }

        .anime-list-header {
            padding: 0.75rem 1rem;
            color: white;
            background: #001542;
            font-weight: bold;
        }

        .anime-row {
            padding: 1rem;
            border-bottom: 1px solid #d1d5db;
            background: #000000;
        }

        .anime-row:nth-child(odd) {
            background: #000307;
        }

        .anime-identity {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .anime-thumbnail {
            width: 75px;
            height: 105px;
            flex-shrink: 0;
            object-fit: cover;
            border-radius: 4px;
        }

        .anime-title {
            margin: 0 0 0.4rem;
            font-size: 1.1rem;
        }

        .watch-status-label {
            color: #4b5563;
            font-size: 0.9rem;
        }

        .anime-information p {
            margin: 0.3rem 0;
            font-size: 0.9rem;
        }

        .edit-form {
            display: grid;
            grid-template-columns: repeat(3, minmax(90px, 1fr));
            gap: 0.6rem;
            align-items: end;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .form-field label {
            font-size: 0.8rem;
            font-weight: bold;
        }

        .form-field input,
        .form-field select {
            width: 100%;
            padding: 0.45rem;
            border: 1px solid #9ca3af;
            border-radius: 4px;
            background: rgb(237, 231, 231);
        }

        .save-button,
        .delete-button {
            padding: 0.55rem 0.8rem;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        .save-button {
            background: #2563eb;
        }

        .delete-button {
            width: 100%;
            background: #dc2626;
        }

        .save-button:hover {
            background: #1d4ed8;
        }

        .delete-button:hover {
            background: #b91c1c;
        }

        .empty-list {
            padding: 2rem;
            text-align: center;
        }

        @media (max-width: 900px) {
            .anime-list-header {
                display: none;
            }

            .anime-row {
                grid-template-columns: 1fr;
            }

            .edit-form {
                grid-template-columns: 1fr;
            }

            .anime-actions {
                width: 100%;
            }
        }

    </style>
</head>

<body>
<div class="nav-bar">
    <div class="nav-left">Anime Tracker</div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/anime">Anime</a>
        <a href="{{ url_for('top_anime') }}">Top Anime</a>
        <a href="/search">Search</a>
        
    </div>
</div>


    <div class="page-body">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='tracker.js') }}"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}

                <script>

                    Swal.fire({
                        icon: "{{ 'error' if category == 'danger' else 'success' }}",
                        title: "{{ message }}",
                        timer: 2500,
                        showConfirmButton: false
                    });

                </script>

            {% endfor %}
        {% endif %}
    {% endwith %}

</body>

</html>
